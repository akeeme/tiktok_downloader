<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>success!</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script>
    window.addEventListener("beforeunload", async function () {
      try {
        // Send cleanup request to the server
        await fetch("{{ url_for('cleanup_immediate', file_id=file_id) }}", {
          method: "POST",
        });
        console.log("Cleanup request sent.");
      } catch (err) {
        console.error("Failed to send cleanup request:", err);
      }
    });
  </script>
</head>
<body>
  <div class="container">
    <h1>gllltttt boww!!!</h1>
    <p>your download is ready.</p>
    <a href="{{ url_for('download_file', file_id=file_id) }}" class="download-link">download now</a>
    <br><br>
    <a href="{{ url_for('index') }}">let's spin back</a>
  </div>
</body>
</html>
